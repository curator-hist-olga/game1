<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хто ти з історії?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: мемна розминка для студентів, але факти — чесні
IDEA: як квести znohub — червоне поле в клітинку, біла картка, чорний жирний текст
PICTURE: червоний фон-зошит, велика біла картка-гра; у результаті — величезна літера героя
COLOUR and TYPE: червоний znohub, білий, чорний, синій акцент; Google Sans
LAYOUT: одна колонка: шапка-логотип, кікер, великий заголовок, біла картка
*/
:root{color-scheme:light dark;--red:#d63a31;--red2:#c4302a;--card:light-dark(#fff,#1d1b1b);--ink:light-dark(#111,#f4f1ef);--mut:light-dark(#6d6a68,#aaa4a0);--line:light-dark(#ececec,#353131);--blue:#1f3df5}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.45 'Google Sans','Google Sans Flex',Rubik,system-ui,sans-serif;overflow-x:clip;
 background:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/62px 62px,linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/62px 62px,linear-gradient(135deg,#dc4a40,var(--red2))}
.wrap{max-width:640px;margin:0 auto;padding:clamp(16px,4vw,40px) 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;position:relative;z-index:2;border-radius:28px;padding:14px 22px}
.dots{display:flex;gap:7px;flex:none}.dots i{width:12px;height:12px;border-radius:50%}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px;letter-spacing:-.04em;line-height:1}
.logo .o{display:inline-grid;place-items:center;width:.62em;height:.62em;border-radius:50%;background:var(--blue);color:#fff;font-size:.6em;vertical-align:.04em;margin:0 .02em}
.logo .p{color:var(--blue)}
.lg{height:36px;width:auto;display:block}
.sub{color:#6d6a68;font-size:15px;font-weight:500;text-align:right}
.kick{color:#fff;text-align:center;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:34px 0 8px;opacity:.92}
h1{color:#fff;text-align:center;font-weight:800;text-transform:uppercase;font-size:clamp(30px,8vw,48px);line-height:1.02;margin:0 0 26px;text-wrap:balance}
.card{background:var(--card);border-radius:34px;padding:clamp(22px,5vw,40px)}
.stat{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:14px;padding:18px 0;border-bottom:2px solid var(--line)}
.stat:last-of-type{border:0}
.stat b{font-size:38px;font-weight:800;line-height:1}
.stat strong{font-weight:800}
.btn{display:block;width:100%;margin-top:22px;min-height:60px;border:0;border-radius:999px;background:var(--red);color:#fff;font:800 18px 'Google Sans','Google Sans Flex',Rubik,sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px}
.btn:focus-visible,.ans:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.prog{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;font-size:15px;color:var(--mut)}
.track{height:8px;border-radius:4px;background:var(--line);margin-bottom:22px;overflow:hidden}
.track i{display:block;height:100%;background:var(--red);transition:width .3s}
h2{font-size:clamp(23px,5vw,30px);font-weight:800;line-height:1.12;margin:0 0 18px;text-wrap:balance}
.ans{display:flex;gap:14px;align-items:center;width:100%;text-align:start;font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:16px 4px;min-height:64px;cursor:pointer}
.ans:last-child{border-bottom:0}
.ans b{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--red);color:#fff;font-weight:800}
.ans:hover b{background:var(--blue)}
.back{background:none;border:0;color:var(--mut);font:700 15px inherit;font-family:inherit;padding:10px 0;cursor:pointer;min-height:44px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-bottom:18px}
.big{width:clamp(96px,22vw,128px);aspect-ratio:1;border-radius:30px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(56px,13vw,76px);line-height:1;transform:rotate(-4deg)}
.hero small{display:block;color:var(--mut);font-weight:700;font-size:15px}
.hero h2{font-size:clamp(28px,6.5vw,40px);margin:4px 0 2px}
.hero span{color:var(--mut);font-size:15px;white-space:nowrap}
.desc{font-size:18px;margin:0 0 6px}
.blk{border-top:2px solid var(--line);padding:16px 0 4px}
.blk h3{margin:0 0 4px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--red)}
.blk p{margin:0}
.bar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 2.8em;gap:10px;align-items:center;font-size:15px;margin:8px 0}
.bar span:nth-child(2){height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar span:nth-child(2) i{display:block;height:100%;background:var(--blue)}
.bar em{font-style:normal;text-align:right;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0;padding:0;list-style:none}
.chips li{background:var(--line);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.note{color:#fff;opacity:.9;font-size:14px;text-align:center;margin:18px 8px 0}
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.track i{transition:none}}
@media(max-width:480px){.logo{gap:10px}.lg{height:28px}.dots i{width:10px;height:10px}.sub{font-size:13px}.stat{grid-template-columns:4em minmax(0,1fr)}.stat b{font-size:30px}.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.bar{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 2.6em;font-size:14px}}

/* --- Янінозаври: перша сторінка --- */
body.dino{background:#fbefe2}
body.dino::before{content:"";position:fixed;inset:0 0 auto;height:300px;z-index:-1;background:radial-gradient(circle at 50% 100%,#fbefe2 62px,transparent 63px) bottom/170px 64px repeat-x,#c8141c}
body.dino #kick,body.dino #ttl,body.dino .note{display:none}
body.dino .wrap{max-width:980px}
body.dino .card{background:transparent;padding:0;margin-top:22px}
.ds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:8px 28px;align-items:center;font-family:Pangolin,Rubik,'Google Sans',sans-serif;color:#1a1210}
.ds .pic{grid-row:span 2;position:relative}
.ds .pic img{width:100%;height:auto;display:block;border-radius:40px;border:5px solid #fff;box-shadow:0 14px 30px rgba(120,20,20,.25);transform:rotate(-2deg)}
.ds .bub{position:relative;background:#fff;border-radius:46px;padding:26px 30px 30px;box-shadow:0 10px 0 #f1d9c4}
.ds h2{font-family:Pangolin,Rubik,sans-serif;font-weight:400;font-size:clamp(38px,6vw,62px);line-height:1.02;margin:0;transform:rotate(-3deg)}
.ds h2 em{font-style:normal;color:#c8141c;display:block}
.ds .hrt{position:absolute;width:44px;height:44px}
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px;font-size:21px;position:relative}
.steps li{display:flex;align-items:center;gap:12px}
.steps li:nth-child(2){margin-left:34px}.steps li:nth-child(3){margin-left:68px}
.steps svg{flex:none;width:42px;height:42px}
.go{display:inline-block;margin-top:20px;font:24px Pangolin,Rubik,sans-serif;color:#fff;background:#c8141c;border:4px solid #fff;border-radius:999px;padding:14px 34px;min-height:60px;cursor:pointer;box-shadow:0 8px 0 #8f0c12;transform:rotate(-2deg);transition:transform .15s}
.go:hover{transform:rotate(0) scale(1.04)}
.go:focus-visible{outline:3px solid #1f3df5;outline-offset:4px}
.dchips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;list-style:none;padding:0;margin:22px 0 0}
.dchips li{background:#fff;border:2px dashed #e7a9a0;border-radius:999px;padding:6px 14px;font-size:17px}
@media(prefers-reduced-motion:reduce){.go{transition:none}}
@media(max-width:700px){.ds{grid-template-columns:1fr}.ds .pic{grid-row:auto;max-width:420px;margin:6px auto 0}.steps{font-size:19px}.go{width:100%}}
</style>
</head>

  <div class="blk"><h3>Ще в тобі є трохи від</h3>
   ${rest.map(t=>`<div class="bar"><span>${esc(H[t[0]].n)}</span><span><i style="width:${Math.round(t[1]/top*100)}%"></i></span><em>${Math.round(t[1]/sum*100)}%</em></div>`).join('')}</div>
  <button class="btn" id="again">Пройти ще раз</button>

}
